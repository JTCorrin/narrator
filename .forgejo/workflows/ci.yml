name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint, build, unit and integration tests
    if: >
      forgejo.event_name == 'workflow_dispatch' ||
      forgejo.event_name == 'push' ||
      forgejo.event.pull_request.head.repo.full_name == forgejo.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: https://github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@8.15.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck and build
        env:
          NARRATOR_API_BASE_URL: https://narrator-api-production-81e4.up.railway.app/api/v1
        run: pnpm build

      - name: Unit and integration tests
        run: pnpm test:ci
